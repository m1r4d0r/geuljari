<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글결</title>
<meta name="description" content="글이 써지는 속도와 숨을 그대로 보여 주는 글 틀">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='12' height='12' fill='%232C2F6B'/%3E%3Crect x='17.5' y='9.5' width='11' height='11' fill='none' stroke='%232C2F6B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@400&family=Song+Myung&display=swap">
<link rel="stylesheet" href="index.css">
<script src="engine.js" defer></script>
<script src="sample.js" defer></script>
<script src="tune.js" defer></script>
<script src="sense.js" defer></script>
<script src="editor.js" defer></script>
<script src="compose.js" defer></script>
<script src="slips.js" defer></script>
<script src="index.js" defer></script>
</head>
<body data-step="write" data-device="pc">

<header class="top">
  <button type="button" class="logo" id="home" aria-label="글결, 쓰기로">
    <span class="logo-mark" aria-hidden="true"><i></i><i></i></span>
    <span class="logo-name">글결</span>
  </button>
  <nav class="steps" aria-label="단계">
    <button type="button" data-go="write">쓰기</button>
    <button type="button" data-go="compose">짜기</button>
    <button type="button" data-go="tune">다듬기</button>
  </nav>
  <div class="seg device" role="group" aria-label="미리보기 화면" id="device">
    <button type="button" data-device="pc">PC</button><button type="button" data-device="mobile">모바일</button>
  </div>
</header>

<main class="steps-body">

  <!-- 쓰기: 입력창 하나 -->
  <section class="step write" id="s-write" aria-label="쓰기">
    <div class="write-body">
      <div class="intro">
        <div>
          <p class="eyebrow">글 한 편으로 시작해요.</p>
          <h1>어떻게 읽히면 좋을까요.</h1>
        </div>
        <div class="intro-links">
          <button type="button" class="link" id="sample">예시 글 넣기</button>
          <button type="button" class="link" id="clear">새로 쓰기</button>
        </div>
      </div>
      <input id="title" class="title" type="text" placeholder="제목 (선택)" aria-label="제목" autocomplete="off">
      <div class="ed" id="write-ed">
        <div class="ed-mirror" id="write-mirror" aria-hidden="true"></div>
        <textarea class="ed-input" id="src" spellcheck="false" aria-label="본문"
          placeholder="여기에 글을 놓아 주세요.&#10;&#10;빈 줄 둘은 새 쪽, 띄어쓰기 두 번은 쉼, 빈 줄 하나는 문단 사이가 돼요."></textarea>
      </div>
    </div>
    <footer class="bar">
      <span class="k" id="count-w"></span>
      <button type="button" class="btn fill push" id="go-compose">쪽 짜기</button>
    </footer>
  </section>

  <!-- 짜기: 쪽 나누기 · 반전 · 심상 · 남길 곳 -->
  <section class="step compose" id="s-compose" aria-label="짜기" hidden>
    <div class="compose-body">
      <div class="cp-col">
        <p class="cp-guide k">줄 사이를 누르면 쪽이 나뉘어요 · 끌어서 고르면 남길 곳이 돼요</p>
        <div class="cp-paper" id="cp-paper"></div>
      </div>
      <aside class="cp-rail" aria-label="심상">
        <h2>어떤 결이에요</h2>
        <div class="moods" id="cp-moods"></div>
        <p class="mix" id="cp-mix"></p>
        <a class="link small" href="simsang.html">낱말 하나씩 살펴보기</a>
      </aside>
      <div class="cp-pop" id="cp-pop" role="group" aria-label="고른 자리" hidden></div>
    </div>
    <footer class="bar">
      <span class="k" id="count-c"></span>
      <button type="button" class="link push" id="back-write">글 고치기</button>
      <button type="button" class="btn fill" id="go-tune">미리보기</button>
    </footer>
  </section>

  <!-- 다듬기: 미리보기 무대와 쪽지 -->
  <section class="step tune" id="s-tune" aria-label="다듬기" hidden>
    <div class="stage" id="stage">
      <div class="frame-box" id="frame-box"><iframe class="frame" id="pv" title="미리보기"></iframe></div>

      <section class="slip" id="slip-page" aria-label="이 쪽" hidden>
        <header class="slip-head"><span class="stamp">1</span><b>이 쪽</b><span class="slip-title k"></span><button type="button" class="link slip-x">접기</button></header>
        <div class="slip-body"></div>
      </section>
      <section class="slip" id="slip-all" aria-label="전체" hidden>
        <header class="slip-head"><span class="stamp all">전</span><b>전체</b><span class="slip-title k"></span><button type="button" class="link slip-x">접기</button></header>
        <div class="slip-body"></div>
      </section>
      <section class="slip wide" id="slip-text" aria-label="이 쪽 글" hidden>
        <header class="slip-head"><span class="stamp">1</span><b>글</b><span class="slip-title k">끌어 고르면 효과를 걸어요</span><button type="button" class="link slip-x">접기</button></header>
        <div class="slip-body">
          <div class="ed small">
            <div class="ed-mirror" aria-hidden="true"></div>
            <textarea class="ed-input" spellcheck="false" aria-label="이 쪽 글"></textarea>
            <div class="fxbar" role="group" aria-label="효과" hidden>
              <span class="fx-list"></span>
              <button type="button" class="link fx-off">빼기</button>
            </div>
          </div>
        </div>
      </section>

      <nav class="ruler" id="ruler" aria-label="쪽과 쪽지">
        <span class="ticks" id="ticks"></span>
        <span class="ruler-act">
          <button type="button" data-slip="page">이 쪽</button>
          <button type="button" data-slip="all">전체</button>
          <button type="button" data-slip="text">글</button>
          <button type="button" id="hide-all" aria-pressed="false">숨기기</button>
          <button type="button" class="pub" disabled title="발행은 3단계에서 붙여요.">발행</button>
        </span>
      </nav>
      <button type="button" class="peek" id="peek" hidden>■□ 꺼내기</button>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
