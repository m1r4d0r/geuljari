<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글결</title>
<meta name="description" content="글이 써지는 속도와 숨을 그대로 보여 주는 글 틀">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='12' height='12' fill='%232C2F6B'/%3E%3Crect x='17.5' y='9.5' width='11' height='11' fill='none' stroke='%232C2F6B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@400&family=Song+Myung&display=swap">
<!-- 테마의 글꼴 이름을 그 글꼴로 보이려고 이름 글자만 불러온다(무게 범위는 tune.js FONTS와 같게) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300..600&family=Gowun+Batang&family=Nanum+Myeongjo&text=%ED%95%A8%EB%A0%9B%EA%B3%A0%EC%9A%B4%EB%B0%94%ED%83%95%EB%82%98%EB%88%94%EB%AA%85%EC%A1%B0&display=swap">
<link rel="stylesheet" href="marks.css">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="look.css">
<script src="engine.js" defer></script>
<script src="sample.js" defer></script>
<script src="tune.js" defer></script>
<script src="sense.js" defer></script>
<script src="editor.js" defer></script>
<script src="compose.js" defer></script>
<script src="panels.js" defer></script>
<script src="flip.js" defer></script>
<script src="look.js" defer></script>
<script src="index.js" defer></script>
</head>
<body data-step="write">

<header class="top">
  <button type="button" class="logo" id="home" aria-label="글결, 글로">
    <span class="logo-mark" aria-hidden="true"><i></i><i></i></span>
    <span class="logo-name">글결</span>
  </button>
  <nav class="steps" aria-label="단계">
    <button type="button" data-go="write">글</button>
    <button type="button" data-go="tune">미리보기</button>
  </nav>
  <span class="top-links">
    <button type="button" class="link" id="guide-open">안내</button>
    <button type="button" class="link" id="sample">예시 글</button>
    <button type="button" class="link" id="clear">새로 쓰기</button>
  </span>
</header>

<main class="steps-body">

  <!-- 글: 입력창 하나에서 쓰고, 쪽을 나누고, 반전·강조를 하고, 옆 칸에서 분위기와 테마를 고른다 -->
  <section class="step write" id="s-write" aria-label="글">
    <div class="write-body">
      <div class="write-col">
        <input id="title" class="title" type="text" placeholder="제목 (선택)" aria-label="제목" autocomplete="off">
        <div class="ed" id="write-ed">
          <div class="ed-mirror" id="write-mirror" aria-hidden="true"></div>
          <textarea class="ed-input" id="src" spellcheck="false" aria-label="본문"
            placeholder="여기에 글을 놓아 주세요.&#10;&#10;빈 줄 둘은 새 쪽이 돼요."></textarea>
        </div>
      </div>
      <aside class="rail" aria-label="설정">
        <section class="rail-sec" aria-labelledby="h-mood">
          <div class="rail-head"><h2 id="h-mood">분위기</h2><button type="button" class="link" id="mood-look">살펴보기</button></div>
          <div class="moods" id="moods"></div>
        </section>
        <section class="rail-sec" aria-labelledby="h-theme">
          <div class="rail-head"><h2 id="h-theme">테마</h2></div>
          <div class="set-row r-theme"><span class="set-name">주색</span><span class="themes" id="themes" aria-label="주색"></span></div>
          <div class="set-row r-font"><span class="set-name">글꼴</span><div class="set-box" id="fonts"></div></div>
          <div class="set-row r-scene"><span class="set-name">시작</span><div class="set-box" id="start-scene"></div></div>
        </section>
        <div class="rail-help">
          <p>줄 사이를 누르면 쪽을 나눠요.</p>
          <p>두 번 띄어 쓰면 잠시 쉬고 읽어요.</p>
          <p>드래그해서 원하는 부분을 강조해요.</p>
        </div>
      </aside>
    </div>
    <footer class="bar">
      <span class="k" id="count"></span>
      <button type="button" class="btn fill push" id="go-tune">미리보기</button>
    </footer>
  </section>

  <!-- 미리보기: 화면을 채운 읽기 틀과, 오른쪽 가장자리 책갈피로 여는 판 -->
  <section class="step tune" id="s-tune" aria-label="미리보기" hidden>
    <div class="stage" id="stage">
      <div class="screen" id="screen-main"><iframe class="frame" title="미리보기"></iframe><iframe class="frame" title="미리보기" tabindex="-1"></iframe></div>
      <div class="screen" id="screen-side" hidden><iframe class="frame" title="폰 미리보기"></iframe><iframe class="frame" title="폰 미리보기" tabindex="-1"></iframe></div>

      <nav class="tabs" id="tabs" aria-label="다듬기">
        <button type="button" class="tab-toggle" id="tab-toggle" aria-expanded="false">다듬기</button>
        <div class="tab-list">
          <button type="button" class="tab back" id="back">글로</button>
          <button type="button" class="tab" data-panel="mood">분위기</button>
          <button type="button" class="tab" data-panel="type">글씨</button>
          <button type="button" class="tab" data-panel="motion">움직임</button>
          <button type="button" class="tab" data-panel="ground">배경</button>
          <button type="button" class="tab replay" id="replay" title="바꾼 움직임은 다시 보기를 눌러야 보여요.">다시 보기</button>
          <span class="tab-dev" role="group" aria-label="미리보기 화면" id="device">
            <button type="button" data-device="pc">PC</button><button type="button" data-device="mobile">폰</button><button type="button" data-device="both" class="wide-only">병렬</button>
          </span>
          <button type="button" class="tab" id="hide-all">숨기기</button>
        </div>
      </nav>

      <section class="panel" id="panel-mood" aria-label="분위기" hidden>
        <header class="panel-head"><b>분위기</b><span class="panel-sub k">글 전체</span><button type="button" class="link panel-look">살펴보기</button><button type="button" class="link panel-x">닫기</button></header>
        <div class="panel-body"></div>
      </section>
      <section class="panel" id="panel-type" aria-label="글씨" hidden>
        <header class="panel-head"><b>글씨</b><span class="panel-sub k">글 전체</span><button type="button" class="link panel-x">닫기</button></header>
        <div class="panel-body"></div>
      </section>
      <section class="panel" id="panel-motion" aria-label="움직임" hidden>
        <header class="panel-head"><b>움직임</b><span class="panel-sub k">다시 보기로 확인</span><button type="button" class="link panel-x">닫기</button></header>
        <div class="panel-body"></div>
      </section>
      <section class="panel" id="panel-ground" aria-label="배경" hidden>
        <header class="panel-head"><b>배경</b><span class="panel-sub k"></span><button type="button" class="link panel-x">닫기</button></header>
        <div class="panel-body"></div>
      </section>

      <div class="zoom" id="zoom" hidden><span class="k" id="zoom-k"></span><button type="button" class="link" id="zoom-fit">맞춤</button></div>
      <button type="button" class="peek" id="peek" aria-label="다듬기 꺼내기" hidden>■□</button>
    </div>
  </section>
</main>

<!-- 처음 들어왔을 때: 편집창을 흐리게 가리고, 기능 다섯 가지를 한 장씩 넘기며 움직이는 장면으로 보인다 -->
<div class="guide" id="guide" role="dialog" aria-modal="true" aria-labelledby="g-title" hidden>
  <section class="g-sheet">
    <div class="g-stage" aria-hidden="true">
      <div class="g-scene" data-n="0">
        <div class="g-moods">
          <span class="ax">온도</span><span class="g-chip g-on">따뜻한</span><span class="g-chip">차가운</span>
          <span class="ax">물기</span><span class="g-chip">젖은</span><span class="g-chip">마른</span>
        </div>
        <p class="g-paper"><span class="g-rise" style="--d:.7s">밤</span><span class="g-rise" style="--d:.82s">이</span> <span class="g-rise" style="--d:1s">깊</span><span class="g-rise" style="--d:1.12s">어</span><span class="g-rise" style="--d:1.24s">지</span><span class="g-rise" style="--d:1.36s">면</span><br><span class="g-rise" style="--d:1.7s">소</span><span class="g-rise" style="--d:1.82s">리</span><span class="g-rise" style="--d:1.94s">가</span> <span class="g-rise" style="--d:2.12s">지</span><span class="g-rise" style="--d:2.24s">워</span><span class="g-rise" style="--d:2.36s">진</span><span class="g-rise" style="--d:2.48s">다</span><span class="g-rise" style="--d:2.6s">.</span></p>
      </div>
      <div class="g-scene" data-n="1">
        <div class="g-split">
          <div class="g-page one"><i class="g-pn">1</i><span>그날도 그랬다.</span><span class="g-leave">편지를 썼다.</span>
            <span class="g-hint"><b>여기서 나누기</b></span>
            <i class="g-cursor"></i>
          </div>
          <span class="g-rule"></span>
          <div class="g-page two"><i class="g-pn">2</i><span>편지를 썼다.</span></div>
        </div>
      </div>
      <div class="g-scene" data-n="2">
        <div class="g-pair">
          <div class="g-mini">펜을 내려놓고<br>창문을 열었다.</div>
          <div class="g-mini"><span>그리고 잉크<br>한 방울이</span><span class="g-iris">그리고 잉크<br>한 방울이</span></div>
        </div>
        <span class="g-toggle"><i></i>반전 · 다크로</span>
      </div>
      <div class="g-scene" data-n="3">
        <p class="g-paper g-line">손을 뻗었다가<span class="g-rest"></span>멈췄다.</p>
        <p class="g-typed"><span class="g-type" style="--d:.2s">손</span><span class="g-type" style="--d:.36s">을</span> <span class="g-type" style="--d:.52s">뻗</span><span class="g-type" style="--d:.68s">었</span><span class="g-type" style="--d:.84s">다</span><span class="g-type" style="--d:1s">가</span> <span class="g-type" style="--d:3.4s">멈</span><span class="g-type" style="--d:3.56s">췄</span><span class="g-type" style="--d:3.72s">다</span><span class="g-type" style="--d:3.88s">.</span></p>
        <div class="g-wait"><span><i></i></span><em>쉼</em></div>
      </div>
      <div class="g-scene" data-n="4">
        <p class="g-paper g-mark"><span class="g-pick"><i class="g-sweep"></i><b class="g-pop">강조</b><span class="g-wavy">보고 싶다고</span></span> 쓰는 것은 너무 무거웠다.</p>
      </div>
    </div>
    <div class="g-text">
      <div class="g-top"><span class="g-count" id="g-count"></span><button type="button" class="link" id="g-skip">건너뛰기</button></div>
      <h2 id="g-title"></h2>
      <p class="g-body" id="g-body"></p>
      <p class="g-tip" id="g-tip"></p>
      <div class="g-nav">
        <div class="g-dots" id="g-dots" role="group" aria-label="안내 장"></div>
        <button type="button" class="btn" id="g-prev">이전</button>
        <button type="button" class="btn fill" id="g-next">다음</button>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
