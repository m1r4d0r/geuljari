[build]
  command = "npm run build"
  publish = "dist"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["published.html"]
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
# 시안·시험판 폴더는 검색에 올리지 않아요(맨 위 시험 페이지는 각 HTML의 robots 메타로)
[[headers]]
  for = "/design/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/meokji/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/codex-proposals/*"
  [headers.values]
    X-Robots-Tag = "noindex"
